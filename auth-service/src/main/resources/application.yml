server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service
  r2dbc:
    url: ${AUTH_DB_URL:r2dbc:postgresql://localhost:5432/auth_db}
    username: ${AUTH_DB_USER:auth_user}
    password: ${AUTH_DB_PASSWORD:auth_pass}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

app:
  jwt:
    issuer: ${JWT_ISSUER:http://auth-service}
    expiration: ${JWT_EXPIRATION:1h}
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
